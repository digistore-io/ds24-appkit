# Local development: Postgres only. The app runs alongside it via `npm run dev`.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # 15432 rather than 5432 on the outside: that way this project's database
      # gets in the way of neither an installed Postgres nor another project.
      # If 15432 is taken too, `node run.mjs start` falls back to the next free port on
      # its own (DB_PORT + DATABASE_URL in .env).
      - "${DB_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
