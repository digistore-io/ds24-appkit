# Lokale Entwicklung: nur Postgres. Die App läuft mit `npm run dev` daneben.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # Läuft auf deinem Rechner schon eine Postgres (oder ein anderes Projekt)
      # auf 5432? Dann DB_PORT in .env auf einen freien Port setzen (z. B. 5433)
      # und die Portangabe in DATABASE_URL mitziehen.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
