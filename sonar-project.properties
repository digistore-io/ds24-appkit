# SonarQube / SonarCloud — Vorlage.
#
# Diese Datei tut nichts, solange kein Sonar-Scan läuft. Wer Sonar einsetzt,
# trägt unten projectKey/organization ein; die Ausnahme darunter ist bereits
# gesetzt, damit der erste Scan nicht mit einem Fehlalarm startet.

# sonar.projectKey=<hier eintragen>
# sonar.organization=<hier eintragen>
sonar.sources=.
sonar.exclusions=node_modules/**,.next/**,drizzle/**

# --- Begründete Ausnahme -----------------------------------------------------
# Der eingebaute Digistore24-Developer-Key ist kein Geheimnis: Er trägt keine
# Rechte an einem Konto, sondern identifiziert nur die Anwendung gegenüber
# requestApiKey/retrieveApiKey — die Rolle einer OAuth-Client-ID. Der
# rechtetragende API-Key entsteht erst bei der Freigabe durch den Merchant.
# Begründung im Detail: lib/digistore/connect.ts (BUILT_IN_DEVELOPER_KEY).
sonar.issue.ignore.multicriteria=ds24devkey1,ds24devkey2
sonar.issue.ignore.multicriteria.ds24devkey1.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.ds24devkey1.resourceKey=lib/digistore/connect.ts
sonar.issue.ignore.multicriteria.ds24devkey2.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.ds24devkey2.resourceKey=scripts/ds24/connect-api-key.mjs
