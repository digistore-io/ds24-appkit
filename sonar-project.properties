# SonarQube / SonarCloud — template.
#
# This file does nothing as long as no Sonar scan runs. If you use Sonar, enter
# projectKey/organization below; the exception underneath is already in place so
# the first scan does not start with a false positive.

# sonar.projectKey=<enter here>
# sonar.organization=<enter here>
sonar.sources=.
sonar.exclusions=node_modules/**,.next/**,drizzle/**

# --- Justified exception -----------------------------------------------------
# The built-in Digistore24 developer key is not a secret: it carries no rights
# to any account, it only identifies the application to
# requestApiKey/retrieveApiKey — the role of an OAuth client ID. The
# rights-bearing API key comes into existence only when the merchant grants
# access. Full reasoning: lib/digistore/connect.ts (BUILT_IN_DEVELOPER_KEY).
sonar.issue.ignore.multicriteria=ds24devkey1,ds24devkey2
sonar.issue.ignore.multicriteria.ds24devkey1.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.ds24devkey1.resourceKey=lib/digistore/connect.ts
sonar.issue.ignore.multicriteria.ds24devkey2.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.ds24devkey2.resourceKey=scripts/ds24/connect-api-key.mjs
