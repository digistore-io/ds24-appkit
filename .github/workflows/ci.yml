# Automatische Prüfung bei jedem Push/PR: Typecheck, Tests und Build.
# So laufen die Tests garantiert – auch wenn man es lokal mal vergisst.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          AUTH_SECRET: ci_dummy_secret
