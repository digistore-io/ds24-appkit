# Automatic checks on every push/PR: typecheck, tests and build.
# So laufen die Tests garantiert – auch wenn man es lokal mal vergisst.
name: CI

on:
  push:
  pull_request:

jobs:
  # Linux, macOS and Windows — this app has to run on all three, because Claude
  # Code does (see CLAUDE.md → Three systems). The commands go through
  # `node run.mjs`, which is exactly the interface the developer uses.
  # On Windows that means bash (Git Bash), the same shell we write for.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Informativ: die gehosteten Runner haben kein brauchbares Docker
      # (macOS gar keins, Windows nur für Windows-Container), und Docker ist
      # nur zum Starten der App nötig, nicht zum Bauen. Der Schritt läuft
      # trotzdem auf allen drei Systemen — er prüft, dass die
      # Plattformerkennung selbst überall durchläuft.
      - name: Alle Werkzeuge da?
        run: node run.mjs doctor
        continue-on-error: true
      - run: node run.mjs typecheck
      - run: node run.mjs test
      - run: node run.mjs build
        env:
          AUTH_SECRET: ci_dummy_secret

  # Checks that the migrations in drizzle/ run cleanly against an empty
  # database — and that nobody commits a schema change without a migration.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Migrationen einspielen
        run: npm run db:migrate
      - name: Schema und Migrationen sind synchron
        # Erzeugt drizzle-kit eine neue Datei, fehlt eine Migration zum Schema.
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::db/schema.ts was changed without generating a migration."
            echo "Run locally: node run.mjs db-generate && node run.mjs db-migrate — and commit drizzle/ along with it."
            git status --porcelain drizzle/
            exit 1
          fi
